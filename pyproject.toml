[project]
name = "distracking-pomodoro"
version = "0.1.0"
description = "A Pomodoro productivity app with gamified focus tasks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "torch>=2.15.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
